services:
  teleflow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teleflow-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUTRADB_URL=http://sutradb:8765
    depends_on:
      - sutradb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  sutradb:
    image: python:3.11-slim
    container_name: sutradb-service
    restart: unless-stopped
    command: sh -c "pip install --no-cache-dir sutradb-core uvicorn && sutradb --host 0.0.0.0 --port 8765 --data-dir /sutra_data"
    ports:
      - "8765:8765"
    volumes:
      - sutra_data:/sutra_data

volumes:
  sutra_data:
